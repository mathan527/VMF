# reference-models.yaml  (catalogue v3 - DRAFT for lead approval, 3 Oct 2026)
# Tier rule (M1.2): low = 4 GB RAM variant, medium = 6 GB, high = 8 GB or more.
# Android/API is NOT looked up per model: it comes from the tier in device-matrix.yaml
#   low = Android 10 (API 29) | medium = Android 12 (API 31) | high = Android 15 (API 35)
# CPU cores also come from the tier (low 2, medium 4, high 6), set in create_avds.py.
# The reference model supplies: screen, density, RAM, cutout and GMS only.
# Never leave a field empty. Missing spec -> rules in M1.6; list the field name in assumed_fields.
# cutout: punch-hole | notch | none      gms: true | false (Huawei = false -> AOSP default image)
#
# Brand strings = device-matrix.yaml: Samsung, Vivo, OnePlus, Xiaomi, Google, Motorola, Honor, Huawei
# (sub-brands such as Redmi go in the model name only).
#
# Selection policy used in this version (per instruction: use the latest models, with the tier RAM):
#   For each brand x tier, the NEWEST model that (a) has a variant with the tier RAM, (b) launched in
#   India 2023-2026 and (c) has an official brand page that was opened/seen in this review (M1.4).
#   The same model can appear in two tiers of one brand when it ships in several RAM sizes; only
#   ram_gb differs. Where a newer model was seen but its official page/spec was not confirmed, it is
#   named in notes for Mathan's peer check (M1.10).
#   Counterpoint India lists (M1.3c) were found only for Vivo Y29 5G and Redmi 14C 5G (2025); they are
#   mentioned in notes. They were NOT used because they are older than the models chosen here.
#
# Fields:
#   source_spec       = official manufacturer page (M1.5)
#   source_secondary  = third-party spec page, only for fields the official page omits
#   secondary_fields  = fields taken from source_secondary
#   derived_fields    = calculated by us (screen_inches from the official cm value, density_dpi from M1.6)
#   assumed_fields    = field NAMES ONLY (M1.6). RAM gaps use the tier default and list ram_gb.
#   notes             = explanation for the reviewer
# A leading "UNVERIFIED URL" in notes means the link follows the brand's URL pattern but was not opened
# in this review. Those links must be opened in M1.10 before catalog-v1 is tagged.

